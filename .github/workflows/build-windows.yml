
name: Build AimTrainer Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "AimTrainer-Novo.zip" -Recurse | Select-Object -First 1
          if (-not $zip) {
            throw "AimTrainer-Novo.zip nao encontrado"
          }

          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\trainer" -Force

          $cmake = Get-ChildItem "$env:RUNNER_TEMP\trainer" -Filter "CMakeLists.txt" -Recurse | Select-Object -First 1

          if (-not $cmake) {
            throw "CMakeLists.txt nao encontrado"
          }

          "SOURCE_DIR=$($cmake.DirectoryName)" >> $env:GITHUB_ENV

      - name: Configurar
        run: cmake -S "$env:SOURCE_DIR" -B build

      - name: Compilar
        run: cmake --build build --config Release

      - name: Baixar EXE
        uses: actions/upload-artifact@v4
        with:
          name: AimTrainer-Windows
          path: build/Release/AimTrainer.exe
          if-no-files-found: error
