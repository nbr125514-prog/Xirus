
name: Build AimTrainer Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair e localizar projeto
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Get-ChildItem . -Filter "AimTrainer-Novo-Corrigido.zip" -Recurse | Select-Object -First 1

          if (-not $zip) {
            throw "Nao encontrei AimTrainer-Novo-Corrigido.zip. Envie o ZIP para a raiz do repositorio."
          }

          $dest = "$env:RUNNER_TEMP\trainer"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dest -Force

          $cmake = Get-ChildItem $dest -Filter "CMakeLists.txt" -Recurse | Select-Object -First 1

          if (-not $cmake) {
            Get-ChildItem $dest -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "CMakeLists.txt nao encontrado no ZIP."
          }

          "SOURCE_DIR=$($cmake.DirectoryName)" | Out-File $env:GITHUB_ENV -Append

      - name: Configurar CMake
        shell: pwsh
        run: |
          cmake -S "$env:SOURCE_DIR" -B build
          if ($LASTEXITCODE -ne 0) { throw "Falha ao configurar CMake" }

      .
      - name: Compilar
        shell: pwsh
        run: |
          cmake --build build --config Release --verbose 2>&1 | Tee-Object -FilePath build-log.txt
          Write-Host "===== LOG COMPLETO DA COMPILACAO ====="
          Get-Content build-log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "COMPILACAO FALHOU"
            exit 1
          }
          

      - name: Verificar executavel
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Filter "AimTrainer.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "AimTrainer.exe nao foi gerado" }
          Write-Host "Executavel encontrado: $($exe.FullName)"

      - name: Publicar executavel
        uses: actions/upload-artifact@v4
        with:
          name: AimTrainer-Windows
          path: build/**/AimTrainer.exe
          if-no-files-found: error
          
